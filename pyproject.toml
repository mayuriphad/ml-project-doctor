[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ml-project-doctor"
dynamic = ["version"]
description = "Audit ML/MLOps projects for data quality, reproducibility, training, experiments, models, dependencies and documentation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mayuri", email = "mayuriphad656@gmail.com" }]
keywords = ["mlops", "machine-learning", "reproducibility", "linter", "audit", "data-quality", "ml-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Zero runtime dependencies: the auditor only uses the standard library.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
ml-project-doctor = "ml_project_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/mayuriphad/ml-project-doctor"
Documentation = "https://github.com/mayuriphad/ml-project-doctor/tree/main/docs"
Repository = "https://github.com/mayuriphad/ml-project-doctor"
Issues = "https://github.com/mayuriphad/ml-project-doctor/issues"
Changelog = "https://github.com/mayuriphad/ml-project-doctor/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ml_project_doctor/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_project_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["ml_project_doctor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The HTML report embeds CSS and markup; long lines there are intentional.
"src/ml_project_doctor/reporters.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ml_project_doctor"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ml-project-doctor]
fail_on = "error"
large_file_mb = 50

